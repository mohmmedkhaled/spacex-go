name: Flutter CI

on:
  push:
  
  pull_request:
 
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.3.10'  # استخدم نفس إصدار مشروعك

    - name: Install dependencies
      run: flutter pub get

    - name: Run analysis
      run: flutter analyze

    - name: Run tests
      run: flutter test
            

