name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.3.10'  # استخدم نفس إصدار مشروعك

    - name: Run Flutter Doctor
      run: flutter doctor -v

    - name: Precache Flutter Dependencies
      run: flutter precache

    - name: Install dependencies
      run: flutter pub get

    - name: Run analysis
      run: flutter analyze

    - name: Run tests
      run: flutter test
            

